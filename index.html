<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رويال جاس - الهيكل التنظيمي الاحترافي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&display=swap');
        :root { --main: #003366; --red: #d32f2f; --white: #ffffff; }
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--main), #001a33); color: white; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 20px; }
        .hero button { padding: 20px 60px; font-size: 1.5rem; background: var(--red); color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.4s; }
        .hero button:hover { transform: scale(1.1); box-shadow: 0 10px 20px rgba(211,47,47,0.4); }

        #departments { display: none; padding: 50px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        
        .dept-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); cursor: pointer; transition: 0.4s; border-bottom: 5px solid var(--main); }
        .dept-card:hover { transform: translateY(-10px); border-bottom: 5px solid var(--red); }
        .dept-card h3 { font-size: 1.4rem; color: var(--main); margin-bottom: 10px; }
        .dept-card p { color: #666; font-size: 0.9rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 700px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close { position: absolute; top: 10px; right: 20px; font-size: 2rem; cursor: pointer; color: var(--red); }
    </style>
</head>
<body>

    <div class="hero" id="landing">
        <h1>رويال جاس - الهيكل التنظيمي</h1>
        <button onclick="start()">استعرض الأقسام الآن</button>
    </div>

    <div id="departments">
        <h2>أقسام الشركة الرئيسية</h2>
        <div class="grid">
            <div class="dept-card" onclick="openModal('العمليات', 'المدير: OPS Manager', 'المعالجة والدهان، الصيانة، الطباعة، القوالب، الضغط، التجميع، التصميم، التصنيع، القطع، خط التجهيز.')"><h3>قسم العمليات</h3></div>
            <div class="dept-card" onclick="openModal('سلسلة الإمداد', 'المدير: Supply Chain Manager', 'المشتريات، التخطيط، المخازن، اللوجستيات، الحركة، توريد محلي وخارجي، تخطيط الإنتاج، MRP.')"><h3>سلسلة الإمداد</h3></div>
            <div class="dept-card" onclick="openModal('القسم الفني', 'المدير: Technical Manager', 'البحث والتطوير، QHSE، تطوير المنتج، صيانة المنتج، تكنولوجيا الإنتاج، مراقبة الجودة، الضغط، التجميع، المعمل، ضمان الجودة، مراقبة الوثائق، الدهان.')"><h3>القسم الفني</h3></div>
            <div class="dept-card" onclick="openModal('القسم التجاري', 'المدير: Commercial Manager', 'التسويق، الإبداع والتصميم، قنوات التواصل، المبيعات، التوزيع، الترويج، اللوجستيات، الاستيراد والتصدير، العلاقات العامة، السكرتارية.')"><h3>القسم التجاري</h3></div>
            <div class="dept-card" onclick="openModal('المالية', 'المدير: Finance Manager', 'المحاسبة، الخزينة، البنوك، العملاء، الموردون، الرواتب، التدقيق العام، الضرائب، محاسبة التكاليف، التخطيط والميزانية، CAPEX، OPEX، مراقبة المخزون.')"><h3>المالية</h3></div>
            <div class="dept-card" onclick="openModal('الموارد البشرية', 'المدير: HR Manager', 'الإدارة، النظافة، البوفيه، النقل، العمليات، إدارة المواهب، التدقيق الداخلي، شؤون الموظفين، الرواتب، التدريب، التوظيف، الشؤون القانونية.')"><h3>الموارد البشرية</h3></div>
            <div class="dept-card" onclick="openModal('تكنولوجيا المعلومات', 'المدير: IT Manager', 'الدعم الفني، مكتب المساعدة، الشبكات والبنية التحتية، الأمن السيبراني، إدارة الخوادم، جدار الحماية، قواعد البيانات، تطوير البرمجيات، أمن السحابة، إدارة الموقع.')"><h3>تكنولوجيا المعلومات</h3></div>
            <div class="dept-card" onclick="openModal('خدمات ما بعد البيع', 'المدير: After-Sales Manager', 'شكاوى العملاء، خدمة الصيانة، استبيان العملاء.')"><h3>ما بعد البيع</h3></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: var(--main);"></h2>
            <p id="modal-manager" style="font-weight: bold; color: var(--red);"></p>
            <p id="modal-body" style="font-size: 1.1rem; line-height: 1.8; color: #444;"></p>
        </div>
    </div>

    <script>
        function start() { document.getElementById('landing').style.display = 'none'; document.getElementById('departments').style.display = 'block'; }
        function openModal(title, manager, body) { 
            document.getElementById('modal-title').innerText = title; 
            document.getElementById('modal-manager').innerText = manager;
            document.getElementById('modal-body').innerText = body; 
            document.getElementById('modal').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
