<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رويال جاس - الهيكل التنظيمي الاحترافي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&display=swap');
        :root { --main: #003366; --red: #d32f2f; --white: #ffffff; }
        body, html { font-family: 'Cairo', sans-serif; background: #f0f2f5; margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
        
        /* الشاشة الافتتاحية مع تأثير الانقسام */
        .hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--main), #001a33);
            color: white;
            text-align: center;
            z-index: 2000;
            transition: clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }
        .hero.split {
            clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
        }
        .hero-logo {
            width: 280px;
            max-width: 80%;
            margin-bottom: 25px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        
        .hero button {
            padding: 18px 55px;
            font-size: 1.4rem;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .hero button:hover { transform: scale(1.1); box-shadow: 0 10px 20px rgba(211,47,47,0.4); }

        /* قسم الأقسام */
        #departments { display: none; padding: 50px; text-align: center; min-height: 100vh; box-sizing: border-box; }
        #departments h2 { color: var(--main); font-size: 2.5rem; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        
        .dept-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); cursor: pointer; transition: 0.4s; border-bottom: 5px solid var(--main); text-align: center; }
        .dept-card:hover { transform: translateY(-10px); border-bottom: 5px solid var(--red); }
        .dept-card h3 { font-size: 1.4rem; color: var(--main); margin-bottom: 10px; }
        .dept-card p { color: #666; font-size: 0.9rem; }

        /* نافذة التفاصيل Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 700px; position: relative; max-height: 80vh; overflow-y: auto; text-align: right; }
        .close { position: absolute; top: 10px; left: 20px; font-size: 2rem; cursor: pointer; color: var(--red); }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية مع اللوجو وتأثير الانقسام -->
    <div class="hero" id="landing">
        <img src="https://i.ibb.co/3069356/logo.jpg" alt="Royal Gas Logo" class="hero-logo" onerror="this.src='https://i.imgur.com/359020260.jpg'">
        <h1 style="font-size: 2rem; margin-bottom: 30px;">الهيكل التنظيمي للشركة</h1>
        <button onclick="start()">استعرض الأقسام الآن</button>
    </div>

    <!-- المحتوى الرئيسي (الأقسام) -->
    <div id="departments">
        <h2>أقسام الشركة الرئيسية</h2>
        <p style="color: #666; font-size: 1.1rem;">اضغط على أي قسم لعرض التفاصيل الإدارية والفرعية</p>
        <div class="grid">
            <div class="dept-card" onclick="openModal('العمليات', 'المدير: OPS Manager', 'المعالجة والدهان، الصيانة، الطباعة، القوالب، الضغط، التجميع، التصميم، التصنيع، القطع، خط التجهيز.')"><h3>قسم العمليات</h3></div>
            <div class="dept-card" onclick="openModal('سلسلة الإمداد', 'المدير: Supply Chain Manager', 'المشتريات، التخطيط، المخازن، اللوجستيات، الحركة، توريد محلي وخارجي، تخطيط الإنتاج، MRP.')"><h3>سلسلة الإمداد</h3></div>
            <div class="dept-card" onclick="openModal('القسم الفني', 'المدير: Technical Manager', 'البحث والتطوير، QHSE، تطوير المنتج، صيانة المنتج، تكنولوجيا الإنتاج، مراقبة الجودة، الضغط، التجميع، المعمل، ضمان الجودة، مراقبة الوثائق، الدهان.')"><h3>القسم الفني</h3></div>
            <div class="dept-card" onclick="openModal('القسم التجاري', 'المدير: Commercial Manager', 'التسويق، الإبداع والتصميم، قنوات التواصل، المبيعات، التوزيع، الترويج، اللوجستيات، الاستيراد والتصدير، العلاقات العامة، السكرتارية.')"><h3>القسم التجاري</h3></div>
            <div class="dept-card" onclick="openModal('المالية', 'المدير: Finance Manager', 'المحاسبة، الخزينة، البنوك، العملاء، الموردون، الرواتب، التدقيق العام، الضرائب، محاسبة التكاليف، التخطيط والميزانية، CAPEX، OPEX، مراقبة المخزون.')"><h3>المالية</h3></div>
            <div class="dept-card" onclick="openModal('الموارد البشرية', 'المدير: HR Manager', 'الإدارة، النظافة، البوفيه، النقل، العمليات، إدارة المواهب، التدقيق الداخلي، شؤون الموظفين، الرواتب، التدريب، التوظيف، الشؤون القانونية.')"><h3>الموارد البشرية</h3></div>
            <div class="dept-card" onclick="openModal('تكنولوجيا المعلومات', 'المدير: IT Manager', 'الدعم الفني، مكتب المساعدة، الشبكات والبنية التحتية، الأمن السيبراني، إدارة الخوادم، جدار الحماية، قواعد البيانات، تطوير البرمجيات، أمن السحابة، إدارة الموقع.')"><h3>تكنولوجيا المعلومات</h3></div>
            <div class="dept-card" onclick="openModal('خدمات ما بعد البيع', 'المدير: After-Sales Manager', 'شكاوى العملاء، خدمة الصيانة، استبيان العملاء.')"><h3>ما بعد البيع</h3></div>
        </div>
    </div>

    <!-- نافذة التفاصيل المنبثقة -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: var(--main); margin-top: 0;"></h2>
            <p id="modal-manager" style="font-weight: bold; color: var(--red); font-size: 1.2rem;"></p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <p id="modal-body" style="font-size: 1.1.rem; line-height: 1.8; color: #444;"></p>
        </div>
    </div>

    <script>
        function start() { 
            const landing = document.getElementById('landing');
            landing.classList.add('split');
            setTimeout(() => {
                landing.style.display = 'none'; 
                document.getElementById('departments').style.display = 'block'; 
            }, 1000);
        }
        
        function openModal(title, manager, body) { 
            document.getElementById('modal-title').innerText = title; 
            document.getElementById('modal-manager').innerText = manager;
            document.getElementById('modal-body').innerText = body; 
            document.getElementById('modal').style.display = 'flex'; 
        }
        
        function closeModal() { 
            document.getElementById('modal').style.display = 'none'; 
        }
    </script>
</body>
</html>
